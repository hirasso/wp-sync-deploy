server {
    listen 80 default_server;
    server_name ~^(?<site>local|staging|prod)\.test$;
    root /srv/$site/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}
